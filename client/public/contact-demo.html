<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact us – demo</title>
<style>body{font-family:system-ui;max-width:420px;margin:40px auto;padding:0 16px}input,textarea,button{display:block;width:100%;margin:8px 0;padding:10px;font:inherit;box-sizing:border-box}button{background:#0f766e;color:#fff;border:0;border-radius:6px;cursor:pointer}</style></head>
<body><h1>Contact us</h1><p>A sample website form. Submitting it creates a lead in the CRM.</p>
<form id="f"><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required>
<input name="phone" placeholder="Phone (optional)"><textarea name="message" rows="4" placeholder="How can we help?"></textarea>
<button>Send message</button><p id="msg"></p></form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target)); body.source = 'Contact form';
  const res = await fetch('/api/leads', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  document.getElementById('msg').textContent = res.ok ? 'Thanks! We will be in touch.' : data.error;
  if (res.ok) e.target.reset();
});
</script></body></html>
